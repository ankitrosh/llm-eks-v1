apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen3-recovery-state
  namespace: llm
data:
  state: |
    {
      "mode": "RUNNING",
      "phase": "STARTING",
      "generation": 0,
      "recoveries": 0,
      "attempt": 0,
      "baseline": null,
      "started_at": null,
      "last_error": null,
      "last_recovery_seconds": null
    }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwen3-recovery-state-writer
  namespace: llm
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["qwen3-recovery-state"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qwen3-recovery-state-writer
  namespace: llm
subjects:
  - kind: ServiceAccount
    name: qwen3-recovery
    namespace: llm
roleRef:
  kind: Role
  name: qwen3-recovery-state-writer
  apiGroup: rbac.authorization.k8s.io
