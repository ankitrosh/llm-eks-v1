apiVersion: v1
kind: Service
metadata:
  name: qwen3-headless
  namespace: llm
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: qwen3
  ports:
    - name: nccl
      port: 29618
      targetPort: 29618
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qwen3
  namespace: llm
spec:
  serviceName: qwen3-headless
  replicas: 2
  podManagementPolicy: Parallel

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  selector:
    matchLabels:
      app: qwen3

  template:
    metadata:
      labels:
        app: qwen3
    spec:
      nodeSelector:
        pool: gpu

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: qwen3
              topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 30

      initContainers:
        - name: model-download
          image: 657173565477.dkr.ecr.us-east-2.amazonaws.com/qwen3-14b-pipeline@sha256:6886820e0696db161f219d6b2b45d9851cbb4a9da57a4879333f70fc5f02e718
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -e
              python -u - <<'PY'
              import os
              from pathlib import Path
              from huggingface_hub import snapshot_download

              repo = "Qwen/Qwen3-14B"
              revision = "40c069824f4251a91eefaf281ebe4c544efd3e18"
              target = Path("/models/qwen3-14b")
              marker = target / ".model_revision"

              target.mkdir(parents=True, exist_ok=True)

              shards = list(target.glob("model-*.safetensors"))

              if (
                  marker.exists()
                  and marker.read_text().strip() == revision
                  and len(shards) == 8
                  and (target / "model.safetensors.index.json").exists()
              ):
                  print("MODEL CACHE HIT: skipping download", flush=True)
              else:
                  print(f"Downloading {repo} at {revision}", flush=True)

                  snapshot_download(
                      repo_id=repo,
                      revision=revision,
                      local_dir=str(target),
                      allow_patterns=[
                          "*.safetensors",
                          "*.json",
                          "tokenizer*",
                          "vocab.json",
                          "merges.txt",
                          "*.model",
                      ],
                      max_workers=3,
                  )

                  shards = list(target.glob("model-*.safetensors"))
                  if len(shards) != 8:
                      raise RuntimeError(
                          f"Expected 8 shards, found {len(shards)}"
                      )

                  marker.write_text(revision + "\n")
                  print("MODEL DOWNLOAD COMPLETE", flush=True)

              print("Model directory:", target, flush=True)
              print("Shard count:", len(shards), flush=True)
              PY
          env:
            - name: HF_HOME
              value: /models/.hf-cache
            - name: HF_HUB_DOWNLOAD_TIMEOUT
              value: "120"
            - name: HF_HUB_ETAG_TIMEOUT
              value: "30"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: model-files
              mountPath: /models

      containers:
        - name: runtime
          image: 657173565477.dkr.ecr.us-east-2.amazonaws.com/qwen3-14b-pipeline@sha256:6886820e0696db161f219d6b2b45d9851cbb4a9da57a4879333f70fc5f02e718
          command: ["/bin/bash", "-lc"]
          args:
            - |
              echo "Model cache ready on $HOSTNAME"
              ls -lh /models/qwen3-14b/config.json
              sleep infinity
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: model-files
              mountPath: /models

  volumeClaimTemplates:
    - metadata:
        name: model-files
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: llm-gp3
        resources:
          requests:
            storage: 50Gi
