apiVersion: v1
kind: ServiceAccount
metadata:
  name: qwen3-recovery
  namespace: llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwen3-recovery
  namespace: llm
rules:
- apiGroups:
  - apps
  resourceNames:
  - qwen3
  resources:
  - statefulsets/scale
  verbs:
  - get
  - patch
- apiGroups:
  - ''
  resourceNames:
  - qwen3-0
  - qwen3-1
  resources:
  - pods
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qwen3-recovery
  namespace: llm
subjects:
- kind: ServiceAccount
  name: qwen3-recovery
  namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qwen3-recovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwen3-recovery-state-writer
  namespace: llm
rules:
- apiGroups:
  - ''
  resourceNames:
  - qwen3-recovery-state
  resources:
  - configmaps
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qwen3-recovery-state-writer
  namespace: llm
subjects:
- kind: ServiceAccount
  name: qwen3-recovery
  namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qwen3-recovery-state-writer
