apiVersion: v1
kind: Service
metadata:
  name: qwen3-headless
  namespace: llm
spec:
  clusterIP: None
  ports:
  - name: nccl
    port: 29618
    protocol: TCP
    targetPort: 29618
  publishNotReadyAddresses: true
  selector:
    app: qwen3
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-api
  namespace: llm
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    statefulset.kubernetes.io/pod-name: qwen3-0
  sessionAffinity: None
  type: ClusterIP
