apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-maintenance-executor-dryrun
  namespace: llm
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: gpu-maintenance-probe
      nodeSelector:
        pool: cpu
      containers:
        - name: executor
          image: python:3.12-slim
          command:
            - python
            - -u
            - /app/executor.py
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: qwen3-maintenance-executor-source
