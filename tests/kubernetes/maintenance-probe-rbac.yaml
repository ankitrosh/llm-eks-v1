apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-maintenance-probe
  namespace: llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-maintenance-probe
  namespace: llm
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-maintenance-probe
  namespace: llm
subjects:
  - kind: ServiceAccount
    name: gpu-maintenance-probe
    namespace: llm
roleRef:
  kind: Role
  name: gpu-maintenance-probe
  apiGroup: rbac.authorization.k8s.io
