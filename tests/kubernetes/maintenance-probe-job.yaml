apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-maintenance-probe
  namespace: llm
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: gpu-maintenance-probe
      nodeSelector:
        pool: cpu
      containers:
        - name: probe
          image: python:3.12-slim
          command: ["python", "-u", "/app/probe.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: gpu-maintenance-probe-source
