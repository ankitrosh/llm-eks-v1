[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eks-runtime"
version = "0.3.5.dev0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
description = "Extensible distributed LLM inference framework with Kubernetes deployment support"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
config = [
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
llm-eks = "llm_runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_runtime", "llm_runtime.*"]
namespaces = true
