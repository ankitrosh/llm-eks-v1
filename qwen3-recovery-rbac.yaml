apiVersion: v1
kind: ServiceAccount
metadata:
  name: qwen3-recovery
  namespace: llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwen3-recovery
  namespace: llm
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: ["qwen3"]
    verbs: ["get", "patch"]

  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["qwen3-0", "qwen3-1"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qwen3-recovery
  namespace: llm
subjects:
  - kind: ServiceAccount
    name: qwen3-recovery
    namespace: llm
roleRef:
  kind: Role
  name: qwen3-recovery
  apiGroup: rbac.authorization.k8s.io
