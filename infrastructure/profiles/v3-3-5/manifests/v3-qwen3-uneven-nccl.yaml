apiVersion: v1
kind: Service
metadata:
  name: v3-qwen3-uneven-nccl-headless
  namespace: llm
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: v3-qwen3-uneven-nccl
  ports:
  - name: rendezvous
    port: 29648
    targetPort: 29648
  - name: control
    port: 29649
    targetPort: 29649
---
apiVersion: batch/v1
kind: Job
metadata:
  name: v3-qwen3-uneven-nccl
  namespace: llm
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: v3-qwen3-uneven-nccl
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 20
      subdomain: v3-qwen3-uneven-nccl-headless
      nodeSelector:
        pool: gpu
      tolerations:
      - operator: Exists
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: v3-qwen3-uneven-nccl
            topologyKey: kubernetes.io/hostname
      containers:
      - name: runtime
        image: 657173565477.dkr.ecr.us-east-2.amazonaws.com/qwen3-14b-pipeline@sha256:514663c208715815ed3516b2dbce2e94158207ffd7adf11348449d95441fd747
        command:
        - python
        - -u
        - /workspace/v3_nccl_qwen3_uneven_integration.py
        env:
        - name: PYTHONPATH
          value: /workspace/src:/workspace:/app:/app/v3
        - name: RANK
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        - name: WORLD_SIZE
          value: '2'
        - name: MASTER_ADDR
          value: v3-qwen3-uneven-nccl-0.v3-qwen3-uneven-nccl-headless.llm.svc.cluster.local
        - name: MASTER_PORT
          value: '29648'
        - name: V3_CTRL_PORT
          value: '29649'
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: NCCL_IB_DISABLE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        resources:
          requests:
            nvidia.com/gpu: '1'
            memory: 2Gi
          limits:
            nvidia.com/gpu: '1'
            memory: 6Gi
        volumeMounts:
        - name: test-code
          mountPath: /workspace
          readOnly: true
        - name: v3-gpt2-shm
          mountPath: /dev/shm
      volumes:
      - name: test-code
        projected:
          sources:
          - configMap:
              name: v3-qwen3-uneven-nccl-code
              items:
              - key: partition
                path: experiments/v3_qwen3_partition.py
              - key: stage_only_provider
                path: experiments/v3_qwen3_stage_only_factory.py
              - key: runner
                path: v3_nccl_qwen3_uneven_integration.py
              - key: provider
                path: experiments/v3_qwen3_process_factory.py
              - key: experiments_init
                path: experiments/__init__.py
              - key: framework_init
                path: src/llm_runtime/__init__.py
              - key: factory
                path: src/llm_runtime/v3_execution_factory.py
              - key: scheduler
                path: src/llm_runtime/v3_pipeline_scheduler.py
              - key: transport
                path: src/llm_runtime/v3_ordered_rank_transport.py
      - name: v3-gpt2-shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
