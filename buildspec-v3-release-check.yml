version: 0.2

phases:
  build:
    commands:
      - |
        set -eu

        REGION=us-east-2
        ACCOUNT=657173565477
        REGISTRY="$ACCOUNT.dkr.ecr.$REGION.amazonaws.com"
        IMAGE="$REGISTRY/qwen3-14b-pipeline@sha256:514663c208715815ed3516b2dbce2e94158207ffd7adf11348449d95441fd747"

        aws ecr get-login-password --region "$REGION" |
          docker login --username AWS --password-stdin "$REGISTRY"

        docker pull "$IMAGE"

        for SCRIPT in \
          v3_cpu_reference_smoke.py \
          v3_cpu_extension_integration.py \
          v3_cpu_cache_integration.py \
          v3_cpu_scheduler_integration.py \
          v3_cpu_process_gpt2_integration.py \
          v3_cpu_qwen3_reference_smoke.py \
          v3_cpu_qwen3_partition_integration.py
        do
          echo "========== RUN $SCRIPT =========="

          docker run --rm \
            --entrypoint python \
            --network none \
            -v "$CODEBUILD_SRC_DIR:/workspace:ro" \
            -w /workspace \
            -e PYTHONPATH=/workspace/src:/workspace \
            "$IMAGE" \
            "/workspace/scripts/$SCRIPT"
        done

        echo "========== RUN V3 scheduler lifecycle tests =========="
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" -m unittest discover -s tests -p 'test_v3_pipeline_scheduler*.py' -v
        echo "========== RUN PROCESS TRANSPORT UNIT TESTS =========="
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" -m unittest discover -s tests -p 'test_v3_process_transport.py' -v

        echo "========== RUN TWO-RANK GLOO TRANSPORT =========="
        docker run --rm           --entrypoint python           --network none           -v "$CODEBUILD_SRC_DIR:/workspace:ro"           -w /workspace           -e PYTHONPATH=/workspace/src:/workspace           -e GLOO_SOCKET_IFNAME=lo \
          -e V3_CTRL_PORT=29619           "$IMAGE"           -m torch.distributed.run           --nnodes=1 --master-addr=127.0.0.1 --master-port=29500           --nproc-per-node=2           /workspace/scripts/v3_gloo_rank_transport_smoke.py

        echo "========== V3.3.1 TENSOR LIMITS =========="
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" -m unittest discover -s tests -p 'test_v3_tensor_limits.py' -v
        echo "========== V3.3.2 EXECUTION FACTORY =========="
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" -m unittest discover -s tests -p 'test_v3_execution_factory.py' -v
        echo "========== V3.3.3b PARTITIONED QWEN3 =========="
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" /workspace/scripts/v3_cpu_qwen3_partition_integration.py
        echo "PASS: V3.3.3b mandatory integration executed"

        echo "========== V3.3.4 QWEN3 STAGE-ONLY LOADING =========="
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" -m unittest discover -s tests -p 'test_v3_qwen3_stage_only.py' -v
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" /workspace/scripts/v3_cpu_qwen3_stage_only_integration.py
        echo "PASS: V3.3.4 stage-only loading regression"

        echo "========== V3.3.5 CONFIGURABLE QWEN3 PARTITIONS =========="
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" -m unittest discover -s tests -p 'test_v3_qwen3_partition.py' -v
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" /workspace/scripts/v3_cpu_qwen3_uneven_partition_integration.py
        echo "PASS: V3.3.5 configurable partition regression"

        echo "========== V3.3.6 QWEN3 LAST-TOKEN LOGITS =========="
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" -m unittest discover -s tests -p 'test_v3_qwen3_last_logits.py' -v
        echo "PASS: V3.3.6 last-token logits regression"

        echo "========== V3 RELEASE WORKING DIRECTORY =========="
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR/working:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" /workspace/scripts/v3_cpu_qwen3_stage_only_integration.py
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR/working:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" /workspace/scripts/v3_cpu_qwen3_uneven_partition_integration.py
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR/working:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" /workspace/scripts/v3_cpu_process_gpt2_integration.py
        docker run --rm --entrypoint python --network none -v "$CODEBUILD_SRC_DIR/working:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace/src:/workspace "$IMAGE" -m unittest discover -s tests -p 'test_v3_qwen3_last_logits.py' -v
        echo "PASS: V3 isolated working directory regression"

        echo "PASS: V3.2.4 scheduler reliability regressions"
