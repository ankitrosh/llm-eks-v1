spec:
  updateStrategy:
    type: OnDelete
    rollingUpdate: null

  template:
    spec:
      volumes:
        - name: nccl-shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi

      containers:
        - name: runtime

          command:
            - /bin/bash
            - -lc

          args:
            - |
              set -euo pipefail

              export RANK="${HOSTNAME##*-}"

              echo "Starting Qwen3 inference"
              echo "Rank: $RANK"
              echo "Master: $MASTER_ADDR:$MASTER_PORT"
              echo "Model: $MODEL_DIR"

              exec bash /app/docker-entrypoint.sh

          env:
            - name: MODE
              value: serve

            - name: MASTER_ADDR
              value: qwen3-0.qwen3-headless.llm.svc.cluster.local

            - name: MASTER_PORT
              value: "29618"

            - name: MODEL_DIR
              value: /models/qwen3-14b

            - name: SPLIT
              value: "20"

            - name: NCCL_SOCKET_IFNAME
              value: eth0

            - name: NCCL_IB_DISABLE
              value: "1"

            - name: NCCL_DEBUG
              value: WARN

            - name: NCCL_TIMEOUT_SECONDS
              value: "180"

            - name: REQUEST_TIMEOUT_SECONDS
              value: "240"

            - name: WARMUP_OUTPUT_TOKENS
              value: "16"

            - name: PYTHONUNBUFFERED
              value: "1"

            - name: OMP_NUM_THREADS
              value: "1"

          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1

          volumeMounts:
            - name: model-files
              mountPath: /models

            - name: nccl-shm
              mountPath: /dev/shm

          ports:
            - name: http
              containerPort: 8000
            - name: rendezvous
              containerPort: 29618
