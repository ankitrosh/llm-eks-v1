apiVersion: v1
kind: Service
metadata:
  name: v32-qwen3-14b-ab-headless
  namespace: llm
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: v32-qwen3-14b-ab
  ports:
  - name: rendezvous
    port: 29658
    targetPort: 29658
  - name: control
    port: 29659
    targetPort: 29659
---
apiVersion: batch/v1
kind: Job
metadata:
  name: v32-qwen3-14b-ab-rank0
  namespace: llm
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: v32-qwen3-14b-ab
        rank: '0'
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 20
      subdomain: v32-qwen3-14b-ab-headless
      nodeSelector:
        pool: gpu
      tolerations:
      - operator: Exists
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: v32-qwen3-14b-ab
            topologyKey: kubernetes.io/hostname
      containers:
      - name: runtime
        image: 657173565477.dkr.ecr.us-east-2.amazonaws.com/qwen3-14b-pipeline@sha256:514663c208715815ed3516b2dbce2e94158207ffd7adf11348449d95441fd747
        command:
        - python3
        - -u
        - /opt/v32/scripts/v3_2_gpu_ab_pipeline.py
        env:
        - name: MASTER_PORT
          value: '29658'
        - name: V3_CTRL_PORT
          value: '29659'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TOKENIZERS_PARALLELISM
          value: 'false'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: RANK
          value: '0'
        - name: WORLD_SIZE
          value: '2'
        - name: MASTER_ADDR
          value: v32-qwen3-14b-ab-rank0.v32-qwen3-14b-ab-headless.llm.svc.cluster.local
        - name: PYTHONPATH
          value: /opt/v32
        - name: MODEL_DIR
          value: /models/qwen3-14b
        - name: NCCL_IB_DISABLE
          value: '1'
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: NCCL_DEBUG
          value: WARN
        - name: V32_REQUESTS
          value: '4'
        - name: V32_PROMPT_TOKENS
          value: '128'
        - name: V32_NEW_TOKENS
          value: '64'
        - name: V31_CTRL_PORT
          value: '29679'
        - name: AB_WARMUP_TOKENS
          value: '64'
        resources:
          requests:
            nvidia.com/gpu: '1'
            memory: 6Gi
          limits:
            nvidia.com/gpu: '1'
            memory: 12Gi
        volumeMounts:
        - name: v3-gpt2-shm
          mountPath: /dev/shm
        - name: model-files
          mountPath: /models
          readOnly: true
        - name: v32-source
          mountPath: /opt/v32
          readOnly: true
      volumes:
      - name: v3-gpt2-shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: model-files
        persistentVolumeClaim:
          claimName: model-files-qwen3-0
          readOnly: true
      - name: v32-source
        configMap:
          name: v32-ab-source
