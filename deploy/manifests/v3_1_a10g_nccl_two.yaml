apiVersion: v1
kind: Service
metadata:
  name: v31-nccl-a10g
  namespace: llm
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: v31-nccl-a10g
  ports:
    - name: rendezvous
      port: 29500
      targetPort: 29500
    - name: control
      port: 29679
      targetPort: 29679
---
apiVersion: batch/v1
kind: Job
metadata:
  name: v31-nccl-a10g
  namespace: llm
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 0
  activeDeadlineSeconds: 420
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: v31-nccl-a10g
    spec:
      subdomain: v31-nccl-a10g
      restartPolicy: Never
      terminationGracePeriodSeconds: 20

      nodeSelector:
        eks.amazonaws.com/nodegroup: gpu-a10g
        node.kubernetes.io/instance-type: g5.xlarge

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: v31-nccl-a10g
              topologyKey: kubernetes.io/hostname

      containers:
        - name: nccl-smoke
          image: 657173565477.dkr.ecr.us-east-2.amazonaws.com/qwen3-14b-pipeline@sha256:514663c208715815ed3516b2dbce2e94158207ffd7adf11348449d95441fd747
          imagePullPolicy: IfNotPresent

          command: ["/bin/sh", "-ec"]
          args:
            - |
              echo "Starting NCCL rank ${RANK}/${WORLD_SIZE}"
              exec python3 /opt/v31/scripts/v3_1_nccl_nrank_smoke.py

          env:
            - name: RANK
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: WORLD_SIZE
              value: "2"
            - name: MASTER_ADDR
              value: v31-nccl-a10g-0.v31-nccl-a10g.llm.svc.cluster.local
            - name: MASTER_PORT
              value: "29500"
            - name: V31_CTRL_PORT
              value: "29679"
            - name: PYTHONPATH
              value: /opt/v31
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: NCCL_IB_DISABLE
              value: "1"
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: NCCL_DEBUG
              value: INFO

          resources:
            requests:
              cpu: 300m
              memory: 2Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "1500m"
              memory: 4Gi
              nvidia.com/gpu: "1"

          volumeMounts:
            - name: v31-code
              mountPath: /opt/v31
              readOnly: true
            - name: nccl-shm
              mountPath: /dev/shm

      volumes:
        - name: v31-code
          configMap:
            name: v31-nccl-code
            items:
              - key: __init__.py
                path: llm_runtime/__init__.py
              - key: v3_1_nrank_transport.py
                path: llm_runtime/v3_1_nrank_transport.py
              - key: v3_1_nccl_nrank_smoke.py
                path: scripts/v3_1_nccl_nrank_smoke.py

        - name: nccl-shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
