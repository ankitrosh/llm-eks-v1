apiVersion: v1
kind: Service
metadata:
  name: v31-gloo-3-qwen3
  namespace: llm
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: v31-gloo-3-qwen3
  ports:
    - name: rendezvous
      port: 29500
      targetPort: 29500
    - name: control
      port: 29679
      targetPort: 29679
---
apiVersion: batch/v1
kind: Job
metadata:
  name: v31-gloo-3-qwen3
  namespace: llm
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 3
  backoffLimit: 0
  activeDeadlineSeconds: 420
  template:
    metadata:
      labels:
        app: v31-gloo-3-qwen3
    spec:
      subdomain: v31-gloo-3-qwen3
      restartPolicy: Never
      terminationGracePeriodSeconds: 20
      nodeSelector:
        pool: gpu-l4
        node.kubernetes.io/instance-type: g6f.large
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: v31-gloo-3-qwen3
              topologyKey: kubernetes.io/hostname
      containers:
        - name: test
          image: 657173565477.dkr.ecr.us-east-2.amazonaws.com/qwen3-14b-pipeline@sha256:514663c208715815ed3516b2dbce2e94158207ffd7adf11348449d95441fd747
          command: ["/bin/sh", "-ec"]
          args:
            - |
              exec python3 /opt/v31/scripts/gloo_qwen3.py
          env:
            - name: RANK
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: WORLD_SIZE
              value: "3"
            - name: MASTER_ADDR
              value: v31-gloo-3-qwen3-0.v31-gloo-3-qwen3.llm.svc.cluster.local
            - name: MASTER_PORT
              value: "29500"
            - name: V31_CTRL_PORT
              value: "29679"
            - name: PYTHONPATH
              value: /opt/v31
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          resources:
            requests:
              cpu: 300m
              memory: 2Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "1500m"
              memory: 4Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: source
              mountPath: /opt/v31
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: v31-l4-gloo-code
            items:
              - key: __init__.py
                path: llm_runtime/__init__.py
              - key: providers_init.py
                path: llm_runtime/providers/__init__.py
              - key: v3_pipeline_scheduler.py
                path: llm_runtime/v3_pipeline_scheduler.py
              - key: v3_execution_factory.py
                path: llm_runtime/v3_execution_factory.py
              - key: v3_qwen3_partition.py
                path: llm_runtime/providers/v3_qwen3_partition.py
              - key: v3_qwen3_process_factory.py
                path: llm_runtime/providers/v3_qwen3_process_factory.py
              - key: v3_qwen3_stage_only_factory.py
                path: llm_runtime/providers/v3_qwen3_stage_only_factory.py
              - key: v3_1_qwen3_layout.py
                path: llm_runtime/providers/v3_1_qwen3_layout.py
              - key: v3_1_qwen3_nrank_factory.py
                path: llm_runtime/providers/v3_1_qwen3_nrank_factory.py
              - key: v3_1_nrank_transport.py
                path: llm_runtime/v3_1_nrank_transport.py
              - key: v3_1_transport_backends.py
                path: llm_runtime/v3_1_transport_backends.py
              - key: gloo_smoke.py
                path: scripts/gloo_smoke.py
              - key: gloo_qwen3.py
                path: scripts/gloo_qwen3.py
